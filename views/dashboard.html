<section class="page-container">
    <div class="welcome-header">
        <p class="small-tag"><i class="fa-regular fa-sun"></i> Welcome Back</p>
        <h1>Study Dashboard</h1>
        <p>Track your academic focus and complete daily study tasks.</p>
    </div>

    <!-- Alert Banner -->
    <div class="alert-banner warning-alert hidden" id="deadlineAlert">
        <i class="fa-solid fa-triangle-exclamation alert-icon"></i>
        <div class="alert-content">
            <strong>Coming up soon:</strong> <span id="deadlineAlertText"></span>
        </div>
        <button class="alert-action" onclick="navigateTo('calendar')">View calendar <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon-wrapper"><i class="fa-solid fa-clock"></i></div>
            <div class="stat-info">
                <h2 id="studyTime">0h 0m</h2>
                <p>Pending Study Hours</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon-wrapper"><i class="fa-solid fa-circle-check"></i></div>
            <div class="stat-info">
                <h2 id="activeTaskStat">0</h2>
                <p>Active Tasks</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon-wrapper"><i class="fa-solid fa-chart-line"></i></div>
            <div class="stat-info">
                <h2 id="completionRate">0%</h2>
                <p>Completion Rate</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon-wrapper"><i class="fa-solid fa-book"></i></div>
            <div class="stat-info">
                <h2 id="subjectCount">0</h2>
                <p>Active Subjects</p>
            </div>
        </div>
    </div>

    <!-- Dashboard Main Grid -->
    <div class="dashboard-columns">
        <div class="card column-main">
            <div class="section-title">
                <h2><i class="fa-solid fa-list-check"></i> Study Tasks</h2>
                <button onclick="navigateTo('planner')" class="dashboard-new-task">
                    <i class="fa-solid fa-plus"></i><span>New task</span>
                </button>
            </div>
            <div id="taskList" class="task-list"></div>
        </div>

        <div class="column-sidebar">
            <div class="card">
                <div class="section-title">
                    <h2><i class="fa-solid fa-calendar-days"></i> Priority Focus</h2>
                </div>
                <p class="muted-text">Keep sessions steady. Use 25-minute Pomodoro focus sprints to avoid burnout.</p>
            </div>
        </div>
    </div>
</section>
