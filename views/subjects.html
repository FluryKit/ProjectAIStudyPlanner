<div class="page-container">
    <!-- View 1: Subject Widget Grid & Add Form -->
    <div id="subjectOverviewSection">
        <div class="card">
            <h2><i class="fa-solid fa-folder-plus"></i> Add Subject</h2>
            <div class="form-row" style="margin-top: 16px;">
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="subjectName" placeholder="e.g. Operating Systems">
                </div>
                <div class="form-group">
                    <label>Difficulty Level</label>
                    <select id="subjectDifficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>
            <button class="primary-button" onclick="addSubject()">+ Add Subject</button>
        </div>

        <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-layer-group"></i> My Subjects</h3>
        <!-- 3-Column Widget Grid Container -->
        <div id="subjectWidgetGrid" class="subject-grid"></div>
    </div>

    <!-- View 2: Detailed Subject Folder View (Initially Hidden) -->
    <div id="subjectDetailSection" class="hidden">
        <div class="back-nav-bar">
            <button class="secondary-button" onclick="closeSubjectDetail()">
                <i class="fa-solid fa-arrow-left"></i> Back to Subjects
            </button>
        </div>
        <div id="subjectDetailContent"></div>
    </div>
</div>
