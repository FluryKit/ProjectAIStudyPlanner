<section class="page-container">
    <div class="welcome-header">
        <p class="small-tag"><i class="fa-solid fa-folder-open"></i> Management</p>
        <h1>My Subjects</h1>
        <p>Organize courses and track course difficulty levels.</p>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-folder-plus"></i> Add Subject</h2>
        
        <div class="form-group">
            <label for="subjectName">Subject Name</label>
            <input type="text" id="subjectName" placeholder="e.g. Cryptography">
        </div>

        <div class="form-group">
            <label for="subjectDifficulty">Difficulty Level</label>
            <select id="subjectDifficulty">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>

        <button class="primary-button" onclick="addSubject()">
            <i class="fa-solid fa-plus"></i> Add Subject
        </button>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-layer-group"></i> Active Subjects</h2>
        <div id="subjectList" class="subject-list"></div>
    </div>
</section>
