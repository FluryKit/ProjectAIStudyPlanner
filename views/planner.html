<section class="page-container">
    <div class="welcome-header">
        <p class="small-tag"><i class="fa-solid fa-robot"></i> Intelligent Scheduling</p>
        <h1>AI Study Planner</h1>
        <p>Describe your goal, and automatically build a structured daily study plan.</p>
    </div>

    <div class="card">
        <div class="form-group">
            <label for="studyMaterialSearch">What would you like to study?</label>
            <div class="material-picker">
                <i class="fa-solid fa-magnifying-glass material-picker-icon"></i>
                <input type="search" id="studyMaterialSearch" placeholder="Type a subject or material, e.g. IMK..." autocomplete="off"
                    role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="plannerMaterialResults"
                    oninput="handlePlannerMaterialSearch(event)" onkeydown="handlePlannerMaterialKeydown(event)"
                    onfocus="handlePlannerMaterialSearch(event)">
                <input type="hidden" id="studyMaterial">
                <div class="material-picker-results hidden" id="plannerMaterialResults" role="listbox"></div>
            </div>
            <input type="text" id="customStudyTopic" class="hidden planner-custom-topic" placeholder="Enter a study topic" aria-label="Custom study topic">
            <p class="form-hint" id="studyMaterialHint">Start typing to find a course, topic, or uploaded material. You can also create a custom topic.</p>
        </div>

        <div class="form-group">
            <label for="studyDescription">Description <span class="optional-label">Optional</span></label>
            <textarea id="studyDescription" rows="3" placeholder="Add a note to help you remember what to focus on..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="deadline">Target Deadline</label>
                <input type="date" id="deadline">
            </div>
            <div class="form-group">
                <label for="dailyHours">Daily Study Time</label>
                <select id="dailyHours">
                    <option value="1">1 hour / day</option>
                    <option value="2" selected>2 hours / day</option>
                    <option value="3">3 hours / day</option>
                    <option value="4">4 hours / day</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="difficulty">Subject Difficulty</label>
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>

        <button class="primary-button" onclick="generatePlan()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI Study Plan
        </button>
    </div>

    <div id="planResult" class="card hidden">
        <h2><i class="fa-solid fa-calendar-check"></i> Generated Schedule</h2>
        <p class="generated-plan-description" id="generatedPlanDescription"></p>
        <div id="generatedPlan" class="generated-plan-container"></div>
    </div>
</section>
