<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyNest - AI Study Planner</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo" onclick="navigateTo('home')">
            <i class="fa-solid fa-dove logo-icon"></i>
            <span>StudyNest</span>
        </div>

        <nav class="app-nav">
            <button class="nav-btn" data-page="home" onclick="navigateTo('home')">
                <i class="fa-solid fa-house"></i> Home
            </button>
            <button class="nav-btn" data-page="progress" onclick="navigateTo('progress')">
                <i class="fa-solid fa-chart-line"></i> Progress Dashboard
            </button>
            <button class="nav-btn" data-page="priority" onclick="navigateTo('priority')">
                <i class="fa-solid fa-brain"></i> AI Priority Matrix
            </button>
            <button class="nav-btn" data-page="calendar" onclick="navigateTo('calendar')">
                <i class="fa-solid fa-calendar-days"></i> Deadline Tracker
            </button>
            <button class="nav-btn" data-page="subjects" onclick="navigateTo('subjects')">
                <i class="fa-solid fa-book-open"></i> Subjects
            </button>
        </nav>

        <!-- Square Lamp Switch with Dynamic Inner Icon -->
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" onchange="toggleTheme()" />
                <div class="slider square">
                    <div class="slider-knob">
                        <i class="fa-solid fa-moon icon-dark"></i>
                        <i class="fa-solid fa-sun icon-light"></i>
                    </div>
                </div>
            </label>
        </div>
    </header>

    <!-- Dynamic content loaded here -->
    <main id="app-container" class="main-content"></main>

    <footer class="app-footer">
        <p><i class="fa-solid fa-graduation-cap"></i> StudyNest AI &mdash; Empowering Smart Learning</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
